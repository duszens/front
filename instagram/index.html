<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Instagram Logo">
            </div>
            <nav>
                <ul>
                    <li><img src="images/home-icon.png" alt="Home"></li>
                    <li><img src="images/search-icon.png" alt="Search"></li>
                    <li><img src="images/explore-icon.png" alt="Explore"></li>
                    <li><img src="images/reels-icon.png" alt="Reels"></li>
                    <li><img src="images/messages-icon.png" alt="Messages"></li>
                    <li><img src="images/notifications-icon.png" alt="Notifications"></li>
                    <li><img src="images/profile-icon.png" alt="Profile"></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="sidebar">
                <div class="profile">
                    <img src="images/profile.jpg" alt="Profile Picture">
                    <div>
                        <strong>username</strong>
                        <span>Name</span>
                    </div>
                </div>
                <div class="suggestions">
                    <h4>Suggestions For You</h4>
                    <div class="suggestion">
                        <img src="images/suggestion1.jpg" alt="Suggestion 1">
                        <div>
                            <strong>suggestion1</strong>
                            <span>Followed by user1 + 3 more</span>
                        </div>
                        <button>Follow</button>
                    </div>
                    <div class="suggestion">
                        <img src="images/suggestion2.jpg" alt="Suggestion 2">
                        <div>
                            <strong>suggestion2</strong>
                            <span>Followed by user2 + 1 more</span>
                        </div>
                        <button>Follow</button>
                    </div>
                </div>
            </div>
            <div class="feed">
                <div class="post">
                    <div class="post-header">
                        <img src="images/profile1.jpg" alt="Profile 1">
                        <strong>user1</strong>
                    </div>
                    <img src="images/post1.jpg" alt="Post 1">
                    <div class="post-actions">
                        <img src="images/like-icon.png" alt="Like">
                        <img src="images/comment-icon.png" alt="Comment">
                        <img src="images/share-icon.png" alt="Share">
                    </div>
                    <div class="post-likes">
                        <strong>user2</strong> and <strong>300 others</strong> liked this
                    </div>
                    <div class="post-caption">
                        <strong>user1</strong> Caption for the post #hashtag
                    </div>
                </div>
                <div class="post">
                    <div class="post-header">
                        <img src="images/profile2.jpg" alt="Profile 2">
                        <strong>user2</strong>
                    </div>
                    <img src="images/post2.jpg" alt="Post 2">
                    <div class="post-actions">
                        <img src="images/like-icon.png" alt="Like">
                        <img src="images/comment-icon.png" alt="Comment">
                        <img src="images/share-icon.png" alt="Share">
                    </div>
                    <div class="post-likes">
                        <strong>user3</strong> and <strong>500 others</strong> liked this
                    </div>
                    <div class="post-caption">
                        <strong>user2</strong> Another caption #anotherhashtag
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
