<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="instagram/images/logo.svg" alt="Shoper_Instagram Logo">
            </div>
            <nav>
                <ul>
                    <li><img src="instagram/images/icons/home.svg" alt="strona domowa"></li>
                    <li><img src="instagram/images/icons/magnifier.svg" alt="szukaj"></li>
                    <li><img src="instagram/images/icons/heart.svg" alt="Polub"></li>
                    <li><img src="instagram/images/icons/menu.svg" alt="menu"></li>

                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="sidebar">
                <div class="profile">
                    <img src="instagram/images/users/betty.jpeg" alt="Profile1">
                    <div>
                        <strong>username</strong>
                        <span>Betty</span>
                    </div>
                </div>
                <div class="suggestions">
                    <h4>Suggestions For You</h4>
                    <div class="suggestion">
                        <img src="instagram/images/users/lisa.jpeg" alt="Suggestion 1">
                        <div>
                            <strong>sugestia_1</strong>
                            <span>obserwowany przez Betty + 3 innych</span>
                        </div>
                        <button>Śledz</button>
                    </div>
                    <div class="suggestion">
                        <img src="instagram/images/users/joanna.jpeg" alt="Suggestion 2">
                        <div>
                            <strong>sugestia_2</strong>
                            <span>obserwowany przez Jonny + 1 innych</span>
                        </div>
                        <button>Śledz</button>
                    </div>
                </div>
            </div>
            <div class="feed">
                <div class="post">
                    <div class="post-header">
                        <img src="instagram/images/photos/stoisko.jpeg" alt="Profile 1">
                        <strong>Magda</strong>
                    </div>
                    <img src="instagram/images/photos/placeholder.png" alt="post numer 1">
                    <div class="post-actions">
                        <img src="instagram/images/icons/heart.svg" alt="polub">
                        <img src="instagram/images/icons/comment.svg" alt="skomentuj">
                        <img src="instagram/images/icons/send.svg" alt="wyślij">
                    </div>
                    <div class="post-likes">
                        <strong>Jake</strong> i <strong>300 innych</strong> lubi to
                    </div>
                    <div class="post-caption">
                        <strong>Alan</strong> #hashtag
                    </div>
                </div>
                <div class="post">
                    <div class="post-header">
                        <img src="instagram/images/photos/placeholder.png" alt="Profile 2">
                        <strong>Paul</strong>
                    </div>
                    <img src="instagram/images/photos/placeholder.png" alt="post numer 2">
                    <div class="post-actions">
                        <img src="instagram/images/icons/heart.svg" alt="polub">
                        <img src="instagram/images/icons/comment.svg" alt="skomentuj">
                        <img src="instagram/images/icons/send.svg" alt="wyślij">
                    </div>
                    <div class="post-likes">
                        <strong>Alan</strong> i <strong>500 innych</strong> lubi to
                    </div>
                    <div class="post-caption">
                        <strong>Jimmy</strong>#hashtag_example
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
